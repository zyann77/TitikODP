<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sistem Navigasi ODP - RnBNET</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* === COLOR PALETTE & VARIABLES === */
        :root {
            /* iOS Dark UI Palette */
            --bg-base: #030408;
            --bg-surface: #0A1020;
            --bg-elevated: #10152E;
            
            /* NOC Specific Sub-Path Colors */
            --c-mahkota1: #FFD700; /* Gold / Amber */
            --c-mahkota2: #0A84FF; /* Electric Blue */
            --c-mahkota3: #BF5AF2; /* Violet / Purple */
            --c-mahkota4: #32ADE6; /* Cyan / Turquoise */
            --c-mahkota5: #FF375F; /* Magenta / Pink */
            --c-bgsr1:    #30D158; /* Green / Emerald */
            --c-bgsr2:    #FF9F0A; /* Orange */
            --c-cibarola: #64D2FF; /* Ice Blue / Sky Blue */
            
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --spring-easing: cubic-bezier(0.32, 0.72, 0, 1);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-primary); height: 100dvh; width: 100vw; overflow: hidden; position: relative; }

        /* === AMBIENT BACKGROUND === */
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; background: var(--bg-base); }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.3; animation: float 20s infinite ease-in-out alternate; }
        .orb-1 { width: 300px; height: 300px; background: var(--c-mahkota2); top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: var(--c-mahkota3); bottom: -20%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

        /* === SLIDER STRUCTURE === */
        .app-slider { display: flex; width: 200vw; height: 100dvh; transition: transform 0.6s var(--spring-easing); }
        .view-search, .view-map { width: 100vw; height: 100%; position: relative; }

        /* === VIEW 1: SEARCH (iOS PREMIUM) === */
        .view-search { overflow-y: auto; padding-bottom: calc(90px + var(--safe-bottom)); }

        .header { padding: 20px; text-align: center; background: linear-gradient(180deg, rgba(3,4,8,0.9) 0%, rgba(3,4,8,0) 100%); animation: fadeInDown 0.8s var(--spring-easing); }
        .header-pill { display: inline-block; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-secondary); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }

        .hero { text-align: center; padding: 20px 20px 30px; animation: fadeInUp 0.8s var(--spring-easing) 0.1s both; }
        .hero-icon-wrapper { width: 72px; height: 72px; margin: 0 auto 16px; background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)); border: 1px solid var(--glass-border); border-radius: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(10, 132, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.1); position: relative; }
        .hero-icon-wrapper::after { content: ''; position: absolute; inset: -1px; border-radius: 23px; background: linear-gradient(135deg, var(--c-mahkota2), var(--c-mahkota3)); z-index: -1; opacity: 0.4; filter: blur(12px); }
        .hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(135deg, #FFF, #A5B4FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .hero p { font-size: 14px; color: var(--text-secondary); }

        .container { padding: 0 20px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 24px; box-shadow: 0 24px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); animation: fadeInUp 0.8s var(--spring-easing) 0.2s both; position: relative; overflow: hidden; }
        .glass-card::before { content: ''; position: absolute; top: 0; left: 20%; width: 60%; height: 100%; background: radial-gradient(ellipse at top, rgba(94, 92, 230, 0.1) 0%, transparent 70%); pointer-events: none; }

        .input-group { position: relative; margin-bottom: 16px; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--c-mahkota2); width: 20px; height: 20px; pointer-events: none; }
        .input-arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); width: 18px; height: 18px; pointer-events: none; transition: color 0.3s; }
        
        select { width: 100%; height: 60px; background: rgba(0, 0, 0, 0.25); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.05); padding: 0 45px 0 50px; font-size: 15px; font-weight: 500; border-radius: 20px; appearance: none; outline: none; cursor: pointer; transition: all 0.3s var(--spring-easing); }
        select:focus { background: rgba(10, 132, 255, 0.1); border-color: rgba(10, 132, 255, 0.5); box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15); }
        select:active { transform: scale(0.98); }
        select:disabled { opacity: 0.4; }
        select option { background: var(--bg-elevated); color: var(--text-primary); }

        .btn-action { width: 100%; height: 60px; background: linear-gradient(135deg, #0A84FF, #5E5CE6); color: white; border: none; border-radius: 20px; font-size: 16px; font-weight: 600; margin-top: 10px; cursor: pointer; display: none; box-shadow: 0 8px 25px rgba(94, 92, 230, 0.3), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s var(--spring-easing); position: relative; overflow: hidden; }
        .btn-action::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); transform: skewX(-20deg); animation: shimmer 3s infinite; }
        .btn-action:active { transform: scale(0.96); box-shadow: 0 4px 15px rgba(94, 92, 230, 0.2); }

        /* === VIEW 2: MAP NOC === */
        #map { width: 100%; height: 100%; z-index: 1; background: #000; }
        
        /* Darken Satellite Map to pop Neon Lines */
        .leaflet-layer { filter: brightness(0.3) contrast(1.2) saturate(0.8); }

        .leaflet-popup-content-wrapper { background: rgba(10, 16, 32, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: white; border-radius: 18px; padding: 4px; border: 1px solid var(--glass-border); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .leaflet-popup-tip { background: rgba(10, 16, 32, 0.85); backdrop-filter: blur(20px); }
        .leaflet-popup-content { margin: 12px; min-width: 170px; text-align: center; }
        .leaflet-popup-content b { font-size: 16px; font-weight: 600; display: block; margin-bottom: 2px; }
        
        .btn-navigasi { display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white !important; padding: 10px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 13px; margin-top: 12px; transition: all 0.2s; }
        .btn-navigasi:active { background: rgba(255,255,255,0.2); transform: scale(0.97); }

        /* === NOC LEGEND === */
        .noc-legend { position: absolute; bottom: calc(95px + var(--safe-bottom)); left: 15px; z-index: 400; background: rgba(5, 6, 10, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 15px 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 10px; color: var(--text-secondary); }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-color { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 10px currentColor; }

        /* === CUSTOM FIBER OPTIC NODES & LINES === */
        .node-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        /* Marker ODP Biasa */
        .node-core { width: 10px; height: 10px; border-radius: 50%; background: #FFF; border: 2px solid; animation: pulseNode 2.5s infinite alternate ease-in-out; }
        /* Marker Server (Uplink) */
        .server-wrapper { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; height: 100%; }
        .server-core { width: 14px; height: 14px; background: #FFF; border: 3px solid #FFD700; border-radius: 50%; box-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; z-index: 2; }
        .server-ring { position: absolute; width: 35px; height: 35px; border: 1.5px solid #FFD700; border-radius: 50%; animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite; opacity: 0.8; }

        /* Flowing Data Animation (SVG Dash) */
        .data-stream {
            stroke-dasharray: 2 24; /* Partikel kecil, jarak jauh */
            animation: flowData 1.5s linear infinite;
        }
        
        @keyframes pulseNode { 0% { transform: scale(0.95); filter: brightness(0.8); } 100% { transform: scale(1.2); filter: brightness(1.5); } }
        @keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
        @keyframes flowData { from { stroke-dashoffset: 26; } to { stroke-dashoffset: 0; } }

        /* === FLOATING BOTTOM NAVIGATION === */
        .bottom-nav-container { position: fixed; bottom: var(--safe-bottom); left: 0; width: 100%; padding: 0 20px; z-index: 1000; display: flex; justify-content: center; }
        .bottom-nav { background: rgba(15, 20, 30, 0.7); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px; display: flex; width: 100%; max-width: 350px; padding: 6px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 24px; color: var(--text-tertiary); cursor: pointer; transition: all 0.4s var(--spring-easing); font-size: 13px; font-weight: 500; }
        .nav-item i { width: 18px; height: 18px; transition: all 0.4s; }
        .nav-item.active { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .nav-item.active i { color: #FFF; filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 100% { left: 200%; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div><div class="orb orb-2"></div>
    </div>

    <!-- Main Slider -->
    <div class="app-slider" id="appSlider">
        
        <!-- === LEFT VIEW: SEARCH === -->
        <div class="view-search">
            <div class="header">
                <div class="header-pill">RnBNET • Area Cibarola & Sekitarnya</div>
            </div>

            <div class="hero">
                <div class="hero-icon-wrapper">
                    <i data-lucide="search" color="white" size="32"></i>
                </div>
                <h1>Cari ODP</h1>
                <p>Arahkan teknisi ke titik pelanggan</p>
            </div>

            <div class="container">
                <div class="glass-card">
                    <div class="input-group">
                        <i data-lucide="server" class="input-icon"></i>
                        <select id="server" onchange="updateJalur()">
                            <option value="" disabled selected>Pilih Server Induk</option>
                            <option value="Cibarola">Server Cibarola</option>
                            <option value="Panglejar">Server Panglejar</option>
                            <option value="Perum">Server Perum</option>
                            <option value="Sukamelang">Server Sukamelang</option>
                        </select>
                        <i data-lucide="chevron-down" class="input-arrow"></i>
                    </div>

                    <div class="input-group">
                        <i data-lucide="network" class="input-icon"></i>
                        <select id="jalur" onchange="updateOdp()" disabled>
                            <option value="" disabled selected>Pilih Jalur Distribusi</option>
                        </select>
                        <i data-lucide="chevron-down" class="input-arrow"></i>
                    </div>

                    <div class="input-group">
                        <i data-lucide="map-pin" class="input-icon"></i>
                        <select id="odp" onchange="checkSelection()" disabled>
                            <option value="" disabled selected>Pilih Titik ODP</option>
                        </select>
                        <i data-lucide="chevron-down" class="input-arrow"></i>
                    </div>

                    <button id="btnMaps" class="btn-action" onclick="bukaMaps()">Cari ODP</button>
                </div>
            </div>
        </div>

        <!-- === RIGHT VIEW: LIVE MAPS NOC === -->
        <div class="view-map">
            
            <!-- Automated NOC Legend -->
            <div class="noc-legend">
                <div class="legend-item"><div class="legend-color" style="color: var(--c-mahkota1); background: var(--c-mahkota1);"></div> Mahkota 1</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-mahkota2); background: var(--c-mahkota2);"></div> Mahkota 2</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-mahkota3); background: var(--c-mahkota3);"></div> Mahkota 3</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-mahkota4); background: var(--c-mahkota4);"></div> Mahkota 4</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-mahkota5); background: var(--c-mahkota5);"></div> Mahkota 5</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-bgsr1); background: var(--c-bgsr1);"></div> BGSR 1</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-bgsr2); background: var(--c-bgsr2);"></div> BGSR 2</div>
                <div class="legend-item"><div class="legend-color" style="color: var(--c-cibarola); background: var(--c-cibarola);"></div> Cibarola 1</div>
            </div>

            <div id="map"></div>
        </div>

    </div>

    <!-- === FLOATING BOTTOM NAVIGATION === -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <div class="nav-item active" id="tabSearch" onclick="slideLayar('kiri')">
                <i data-lucide="search"></i><span>Pencarian ODP</span>
            </div>
            <div class="nav-item" id="tabMap" onclick="slideLayar('kanan')">
                <i data-lucide="radio"></i><span>Live Maps</span>
            </div>
        </div>
    </div>

    <script src="data-odp.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        lucide.createIcons();

        function slideLayar(arah) {
            const slider = document.getElementById('appSlider');
            const tabSearch = document.getElementById('tabSearch');
            const tabMap = document.getElementById('tabMap');

            if (arah === 'kiri') {
                slider.style.transform = 'translateX(0)';
                tabSearch.classList.add('active'); tabMap.classList.remove('active');
            } else if (arah === 'kanan') {
                slider.style.transform = 'translateX(-100vw)';
                tabMap.classList.add('active'); tabSearch.classList.remove('active');
                setTimeout(() => { map.invalidateSize(); }, 400);
            }
        }

        // --- ORIGINAL APP LOGIC (NO CHANGES) ---
        function updateJalur() {
            const serverSelect = document.getElementById("server").value;
            const jalurSelect = document.getElementById("jalur");
            const odpSelect = document.getElementById("odp");
            const btnMaps = document.getElementById("btnMaps");

            jalurSelect.innerHTML = '<option value="" disabled selected>Pilih Jalur Distribusi</option>';
            odpSelect.innerHTML = '<option value="" disabled selected>Pilih Titik ODP</option>';
            jalurSelect.disabled = true; odpSelect.disabled = true; btnMaps.style.display = "none";

            if (serverSelect && dataJaringan[serverSelect]) {
                const daftarJalur = dataJaringan[serverSelect];
                if (Object.keys(daftarJalur).length > 0) {
                    jalurSelect.disabled = false;
                    for (const namaJalur in daftarJalur) {
                        const option = document.createElement("option");
                        option.value = namaJalur; option.textContent = namaJalur;
                        jalurSelect.appendChild(option);
                    }
                }
            }
        }

        function updateOdp() {
            const serverSelect = document.getElementById("server").value;
            const jalurSelect = document.getElementById("jalur").value;
            const odpSelect = document.getElementById("odp");
            const btnMaps = document.getElementById("btnMaps");

            odpSelect.innerHTML = '<option value="" disabled selected>Pilih Titik ODP</option>';
            btnMaps.style.display = "none";

            if (serverSelect && jalurSelect && dataJaringan[serverSelect][jalurSelect]) {
                odpSelect.disabled = false;
                const daftarOdp = dataJaringan[serverSelect][jalurSelect];
                for (const namaOdp in daftarOdp) {
                    const option = document.createElement("option");
                    option.value = daftarOdp[namaOdp] !== "" ? daftarOdp[namaOdp] : "KOSONG";
                    option.textContent = namaOdp;
                    odpSelect.appendChild(option);
                }
            } else { odpSelect.disabled = true; }
        }

        function checkSelection() {
            const odpSelect = document.getElementById("odp").value;
            const btnMaps = document.getElementById("btnMaps");
            if (odpSelect !== "") { 
                btnMaps.style.display = "block"; 
                btnMaps.style.animation = "none";
                setTimeout(() => btnMaps.style.animation = "fadeInUp 0.4s var(--spring-easing)", 10);
            } else { btnMaps.style.display = "none"; }
        }

        function bukaMaps() {
            const btn = document.getElementById("btnMaps");
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="lucide-spin" style="margin-right:8px; animation: spin 1s linear infinite;"></i> Memproses...`;
            lucide.createIcons();
            
            setTimeout(() => {
                const koordinat = document.getElementById("odp").value;
                if (koordinat === "KOSONG") { 
                    alert("Titik koordinat Maps untuk ODP ini belum dimasukkan."); 
                } else if (koordinat) { 
                    window.open(`https://www.google.com/maps/dir/?api=1&destination=${koordinat}`, "_blank"); 
                }
                btn.innerHTML = originalText;
            }, 600);
        }

        // --- MAP INITIALIZATION ---
        var map = L.map('map', { zoomControl: false }).setView([-6.5728706, 107.7746767], 16);
        L.control.zoom({ position: 'topright' }).addTo(map); // Pindah ke kanan atas agar tidak nabrak legend

        // Map Satelit sebagai Base Layer
        L.tileLayer('http://{s}.google.com/vt?lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);

        // --- NOC NETWORK LOGIC (Warna Spesifik Sesuai Request) ---
        
        // 1. Mapping Kelompok Berdasarkan Nama ODP
        const groupMapping = [
            { prefix: "Mahkota 1", color: "var(--c-mahkota1)" },
            { prefix: "Mahkota 2", color: "var(--c-mahkota2)" },
            { prefix: "Mahkota 3", color: "var(--c-mahkota3)" },
            { prefix: "Mahkota 4", color: "var(--c-mahkota4)" },
            { prefix: "Mahkota 5", color: "var(--c-mahkota5)" },
            { prefix: "BGSR 1", color: "var(--c-bgsr1)" },
            { prefix: "BGSR 2", color: "var(--c-bgsr2)" },
            { prefix: "Cibarola 1", color: "var(--c-cibarola)" },
        ];

        // 2. Ikon Server Utama (UPLINK GOLD)
        var serverIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="server-wrapper"><div class="server-core"></div><div class="server-ring"></div></div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        L.marker([-6.5728706, 107.7746767], {icon: serverIcon}).addTo(map).bindPopup(`
            <b style="color: var(--c-mahkota1); text-shadow: 0 0 10px rgba(255,215,0,0.5);">SERVER CIBAROLA</b>
            <span style="font-size: 13px; color: rgba(255,255,255,0.6);">Uplink Utama</span>
            <a href="https://www.google.com/maps/dir/?api=1&destination=-6.5728706,107.7746767" target="_blank" class="btn-navigasi">Arahkan Rute</a>
        `); 

        // 3. Ekstrak Data dan Kelompokkan berdasarkan Prefix
        // Ini memastikan ODP 1.1 -> 1.2 -> 1.9 tersambung urut satu garis
        let networkPaths = {};
        
        // Inisialisasi wadah untuk tiap group
        groupMapping.forEach(grp => { networkPaths[grp.prefix] = { color: grp.color, nodes: [] }; });

        for (const server in dataJaringan) {
            for (const jalur in dataJaringan[server]) {
                for (const namaOdp in dataJaringan[server][jalur]) {
                    const koordinat = dataJaringan[server][jalur][namaOdp];
                    
                    if (koordinat !== "") {
                        const lat = parseFloat(koordinat.split(',')[0].trim());
                        const lng = parseFloat(koordinat.split(',')[1].trim());

                        // Cek nama ODP masuk kelompok mana
                        let matchedPrefix = null;
                        let matchedColor = "#FFFFFF";

                        for (const mapItem of groupMapping) {
                            if (namaOdp.startsWith(mapItem.prefix)) {
                                matchedPrefix = mapItem.prefix;
                                matchedColor = mapItem.color;
                                break;
                            }
                        }

                        if (matchedPrefix) {
                            // Simpan Node ke Kelompok
                            networkPaths[matchedPrefix].nodes.push({ name: namaOdp, lat: lat, lng: lng, jalur: jalur });

                            // Gambar Marker Node Premium
                            const odpIcon = L.divIcon({
                                className: 'custom-div-icon',
                                html: `<div class="node-wrapper"><div class="node-core" style="border-color: ${matchedColor}; box-shadow: 0 0 12px ${matchedColor}, inset 0 0 4px ${matchedColor};"></div></div>`,
                                iconSize: [16, 16], iconAnchor: [8, 8]
                            });

                            L.marker([lat, lng], {icon: odpIcon}).addTo(map).bindPopup(`
                                <b style="color: ${matchedColor}; text-shadow: 0 0 10px ${matchedColor};">${namaOdp}</b>
                                <span style="font-size: 12px; color: rgba(255,255,255,0.6);">${jalur}</span>
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="btn-navigasi">Arahkan Rute</a>
                            `);
                        }
                    }
                }
            }
        }

        // 4. Gambar Garis Fiber Optic Sesuai Kelompok Secara Terpisah
        for (const groupKey in networkPaths) {
            const groupData = networkPaths[groupKey];
            const nodes = groupData.nodes;
            
            if (nodes.length > 1) {
                // Urutkan data berdasarkan nama agar garis ditarik urut dari 1.1 ke 1.2 dst (Ascending)
                nodes.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
                
                // Kumpulkan koordinat untuk menarik garis
                const pathCoords = nodes.map(n => [n.lat, n.lng]);
                const c = groupData.color;

                // LAYER 1: OUTER GLOW (Lembut transparan)
                L.polyline(pathCoords, { color: c, weight: 14, opacity: 0.15, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);

                // LAYER 2: INNER NEON GLOW (Cahaya Inti)
                L.polyline(pathCoords, { color: c, weight: 5, opacity: 0.6, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);

                // LAYER 3: INTI FIBER (Super tipis putih/terang)
                L.polyline(pathCoords, { color: '#FFFFFF', weight: 1, opacity: 0.9, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);

                // LAYER 4: DATA PARTICLES (Animasi Titik Mengalir)
                L.polyline(pathCoords, { color: '#FFFFFF', weight: 3, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false, className: 'data-stream' }).addTo(map);
            }
        }
        
    </script>
</body>
</html>
