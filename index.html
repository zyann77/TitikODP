<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sistem Navigasi ODP - RnBNET</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* === COLOR PALETTE & VARIABLES === */
        :root {
            --bg-base: #05060A;
            --bg-surface: #0A1020;
            --bg-elevated: #10152E;
            
            --accent-blue: #0A84FF;
            --accent-indigo: #5E5CE6;
            --accent-purple: #BF5AF2;
            
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            
            --玻璃-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.10);
            
            --spring-easing: cubic-bezier(0.32, 0.72, 0, 1);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg-base); color: var(--text-primary); 
            height: 100dvh; width: 100vw; overflow: hidden; position: relative;
        }

        /* === ANIMATED AURORA BACKGROUND === */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; overflow: hidden; background: var(--bg-base);
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px);
            opacity: 0.4; animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--accent-indigo); top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent-purple); bottom: -20%; right: -10%; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--accent-blue); top: 40%; left: 40%; animation-delay: -10s; opacity: 0.2; }
        
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.2); } }

        /* === FLOATING DECORATIVE ELEMENTS === */
        .floating-elements { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .float-icon {
            position: absolute; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            border-radius: 50%; padding: 12px; color: var(--text-tertiary); backdrop-filter: blur(10px);
            animation: slowFloat 15s infinite ease-in-out alternate;
        }
        .fi-1 { top: 15%; right: 10%; animation-delay: 0s; }
        .fi-2 { top: 45%; left: 5%; animation-delay: -3s; }
        .fi-3 { bottom: 30%; right: 15%; animation-delay: -7s; }
        @keyframes slowFloat { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-30px) rotate(10deg); } }

        /* === SLIDER STRUCTURE === */
        .app-slider { display: flex; width: 200vw; height: 100dvh; transition: transform 0.6s var(--spring-easing); }
        .view-search, .view-map { width: 100vw; height: 100%; position: relative; }

        /* === VIEW 1: SEARCH === */
        .view-search { overflow-y: auto; padding-bottom: calc(90px + var(--safe-bottom)); }

        .header { padding: 20px; text-align: center; background: linear-gradient(180deg, rgba(5,6,10,0.8) 0%, rgba(5,6,10,0) 100%); animation: fadeInDown 0.8s var(--spring-easing); }
        .header-pill { display: inline-block; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-secondary); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }

        .hero { text-align: center; padding: 20px 20px 30px; animation: fadeInUp 0.8s var(--spring-easing) 0.1s both; }
        .hero-icon-wrapper { width: 72px; height: 72px; margin: 0 auto 16px; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border: 1px solid var(--glass-border); border-radius: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(10, 132, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.2); position: relative; }
        .hero-icon-wrapper::after { content: ''; position: absolute; inset: -1px; border-radius: 23px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); z-index: -1; opacity: 0.5; filter: blur(10px); }
        .hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(135deg, #FFF, #A5B4FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .hero p { font-size: 14px; color: var(--text-secondary); }

        .container { padding: 0 20px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; padding: 24px; box-shadow: 0 24px 40px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1); animation: fadeInUp 0.8s var(--spring-easing) 0.2s both; position: relative; overflow: hidden; }
        .glass-card::before { content: ''; position: absolute; top: 0; left: 20%; width: 60%; height: 100%; background: radial-gradient(ellipse at top, rgba(94, 92, 230, 0.15) 0%, transparent 70%); pointer-events: none; }

        .input-group { position: relative; margin-bottom: 16px; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--accent-blue); width: 20px; height: 20px; pointer-events: none; }
        .input-arrow { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); width: 18px; height: 18px; pointer-events: none; transition: color 0.3s; }
        
        select { width: 100%; height: 60px; background: rgba(0, 0, 0, 0.2); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.05); padding: 0 45px 0 50px; font-size: 15px; font-weight: 500; border-radius: 20px; appearance: none; outline: none; cursor: pointer; transition: all 0.3s var(--spring-easing); }
        select:focus { background: rgba(10, 132, 255, 0.1); border-color: rgba(10, 132, 255, 0.5); box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15); }
        select:active { transform: scale(0.98); }
        select:disabled { opacity: 0.5; }
        select option { background: var(--bg-elevated); color: var(--text-primary); }

        .btn-action { width: 100%; height: 60px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo)); color: white; border: none; border-radius: 20px; font-size: 16px; font-weight: 600; margin-top: 10px; cursor: pointer; display: none; box-shadow: 0 8px 25px rgba(94, 92, 230, 0.4), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s var(--spring-easing); position: relative; overflow: hidden; }
        .btn-action::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); transform: skewX(-20deg); animation: shimmer 3s infinite; }
        .btn-action:active { transform: scale(0.96); box-shadow: 0 4px 15px rgba(94, 92, 230, 0.3); }

        /* === VIEW 2: MAP === */
        #map { width: 100%; height: 100%; z-index: 1; }
        
        .leaflet-popup-content-wrapper { background: rgba(16, 21, 46, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: white; border-radius: 20px; padding: 5px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .leaflet-popup-tip { background: rgba(16, 21, 46, 0.85); backdrop-filter: blur(20px); }
        .leaflet-popup-content { margin: 12px; min-width: 180px; text-align: center; }
        .leaflet-popup-content b { color: #FFF; font-size: 16px; font-weight: 600; display: block; margin-bottom: 4px; }
        
        .btn-navigasi { display: flex; align-items: center; justify-content: center; gap: 6px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo)); color: white !important; padding: 12px; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 14px; margin-top: 14px; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3); }

        /* === CUSTOM MAP NODES & NEON ANIMATION === */
        .node-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .node-core { width: 10px; height: 10px; border-radius: 50%; background: white; border: 2px solid; animation: pulseNode 2s infinite alternate; }
        
        .server-wrapper { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; height: 100%; }
        .server-core { width: 14px; height: 14px; background: #FFD700; border-radius: 50%; box-shadow: 0 0 15px #FFD700, 0 0 30px #FFD700; z-index: 2; }
        .server-ring { position: absolute; width: 30px; height: 30px; border: 2px solid #FFD700; border-radius: 50%; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; opacity: 0.8; }

        .data-stream { stroke-dasharray: 6 12; animation: flowData 1.2s linear infinite; }
        
        @keyframes pulseNode { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.3); filter: brightness(1.5); } }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        @keyframes flowData { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }

        /* === FLOATING BOTTOM NAVIGATION === */
        .bottom-nav-container { position: fixed; bottom: var(--safe-bottom); left: 0; width: 100%; padding: 0 20px; z-index: 1000; display: flex; justify-content: center; }
        .bottom-nav { background: rgba(20, 20, 30, 0.65); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; display: flex; width: 100%; max-width: 350px; padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: slideUpNav 0.8s var(--spring-easing) 0.3s both; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 24px; color: var(--text-tertiary); cursor: pointer; transition: all 0.4s var(--spring-easing); font-size: 13px; font-weight: 500; }
        .nav-item i { width: 18px; height: 18px; transition: all 0.4s; }
        
        .nav-item.active { background: rgba(10, 132, 255, 0.15); color: var(--text-primary); box-shadow: inset 0 0 0 1px rgba(10, 132, 255, 0.2); }
        .nav-item.active i { color: var(--accent-blue); filter: drop-shadow(0 0 8px rgba(10,132,255,0.6)); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpNav { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 100% { left: 200%; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Ambient Animated Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
    </div>

    <!-- Floating Decorative Icons -->
    <div class="floating-elements">
        <i data-lucide="server" class="float-icon fi-1"></i>
        <i data-lucide="network" class="float-icon fi-2"></i>
        <i data-lucide="radio" class="float-icon fi-3"></i>
    </div>

    <!-- Main Slider -->
    <div class="app-slider" id="appSlider">
        
        <!-- === LEFT VIEW: SEARCH === -->
        <div class="view-search">
            <div class="header">
                <div class="header-pill">RnBNET • Area Cibarola & Sekitarnya</div>
            </div>

            <div class="hero">
                <div class="hero-icon-wrapper">
                    <i data-lucide="search" color="white" size="32"></i>
                </div>
                <h1>Cari ODP</h1>
                <p>Arahkan teknisi ke titik pelanggan</p>
            </div>

            <div class="container">
                <div class="glass-card">
                    <div class="input-group">
                        <i data-lucide="server" class="input-icon"></i>
                        <select id="server" onchange="updateJalur()">
                            <option value="" disabled selected>Pilih Server Induk</option>
                            <option value="Cibarola">Server Cibarola</option>
                            <option value="Panglejar">Server Panglejar</option>
                            <option value="Perum">Server Perum</option>
                            <option value="Sukamelang">Server Sukamelang</option>
                        </select>
                        <i data-lucide="chevron-down" class="input-arrow"></i>
                    </div>

                    <div class="input-group">
                        <i data-lucide="network" class="input-icon"></i>
                        <select id="jalur" onchange="updateOdp()" disabled>
                            <option value="" disabled selected>Pilih Jalur Distribusi</option>
                        </select>
                        <i data-lucide="chevron-down" class="input-arrow"></i>
                    </div>

                    <div class="input-group">
                        <i data-lucide="map-pin" class="input-icon"></i>
                        <select id="odp" onchange="checkSelection()" disabled>
                            <option value="" disabled selected>Pilih Titik ODP</option>
                        </select>
                        <i data-lucide="chevron-down" class="input-arrow"></i>
                    </div>

                    <button id="btnMaps" class="btn-action" onclick="bukaMaps()">Cari ODP</button>
                </div>
            </div>
        </div>

        <!-- === RIGHT VIEW: LIVE MAPS NOC === -->
        <div class="view-map">
            <div id="map"></div>
        </div>

    </div>

    <!-- === FLOATING BOTTOM NAVIGATION === -->
    <div class="bottom-nav-container">
        <div class="bottom-nav">
            <div class="nav-item active" id="tabSearch" onclick="slideLayar('kiri')">
                <i data-lucide="search"></i><span>Pencarian ODP</span>
            </div>
            <div class="nav-item" id="tabMap" onclick="slideLayar('kanan')">
                <i data-lucide="map"></i><span>Live Maps</span>
            </div>
        </div>
    </div>

    <script src="data-odp.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        lucide.createIcons();

        function slideLayar(arah) {
            const slider = document.getElementById('appSlider');
            const tabSearch = document.getElementById('tabSearch');
            const tabMap = document.getElementById('tabMap');

            if (arah === 'kiri') {
                slider.style.transform = 'translateX(0)';
                tabSearch.classList.add('active'); tabMap.classList.remove('active');
            } else if (arah === 'kanan') {
                slider.style.transform = 'translateX(-100vw)';
                tabMap.classList.add('active'); tabSearch.classList.remove('active');
                setTimeout(() => { map.invalidateSize(); }, 400);
            }
        }

        // --- ORIGINAL APP LOGIC ---
        function updateJalur() {
            const serverSelect = document.getElementById("server").value;
            const jalurSelect = document.getElementById("jalur");
            const odpSelect = document.getElementById("odp");
            const btnMaps = document.getElementById("btnMaps");

            jalurSelect.innerHTML = '<option value="" disabled selected>Pilih Jalur Distribusi</option>';
            odpSelect.innerHTML = '<option value="" disabled selected>Pilih Titik ODP</option>';
            jalurSelect.disabled = true; odpSelect.disabled = true; btnMaps.style.display = "none";

            if (serverSelect && dataJaringan[serverSelect]) {
                const daftarJalur = dataJaringan[serverSelect];
                if (Object.keys(daftarJalur).length > 0) {
                    jalurSelect.disabled = false;
                    for (const namaJalur in daftarJalur) {
                        const option = document.createElement("option");
                        option.value = namaJalur; option.textContent = namaJalur;
                        jalurSelect.appendChild(option);
                    }
                }
            }
        }

        function updateOdp() {
            const serverSelect = document.getElementById("server").value;
            const jalurSelect = document.getElementById("jalur").value;
            const odpSelect = document.getElementById("odp");
            const btnMaps = document.getElementById("btnMaps");

            odpSelect.innerHTML = '<option value="" disabled selected>Pilih Titik ODP</option>';
            btnMaps.style.display = "none";

            if (serverSelect && jalurSelect && dataJaringan[serverSelect][jalurSelect]) {
                odpSelect.disabled = false;
                const daftarOdp = dataJaringan[serverSelect][jalurSelect];
                for (const namaOdp in daftarOdp) {
                    const option = document.createElement("option");
                    option.value = daftarOdp[namaOdp] !== "" ? daftarOdp[namaOdp] : "KOSONG";
                    option.textContent = namaOdp;
                    odpSelect.appendChild(option);
                }
            } else { odpSelect.disabled = true; }
        }

        function checkSelection() {
            const odpSelect = document.getElementById("odp").value;
            const btnMaps = document.getElementById("btnMaps");
            if (odpSelect !== "") { 
                btnMaps.style.display = "block"; 
                btnMaps.style.animation = "none";
                setTimeout(() => btnMaps.style.animation = "fadeInUp 0.4s var(--spring-easing)", 10);
            } else { btnMaps.style.display = "none"; }
        }

        function bukaMaps() {
            const btn = document.getElementById("btnMaps");
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="lucide-spin" style="margin-right:8px; animation: spin 1s linear infinite;"></i> Memproses...`;
            lucide.createIcons();
            
            setTimeout(() => {
                const koordinat = document.getElementById("odp").value;
                if (koordinat === "KOSONG") { 
                    alert("Titik koordinat Maps untuk ODP ini belum dimasukkan."); 
                } else if (koordinat) { 
                    window.open(`https://www.google.com/maps/dir/?api=1&destination=${koordinat}`, "_blank"); 
                }
                btn.innerHTML = originalText;
            }, 600);
        }

        // --- MAP INITIALIZATION ---
        var map = L.map('map', { zoomControl: false }).setView([-6.5728706, 107.7746767], 16);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        var googleHybrid = L.tileLayer('http://{s}.google.com/vt?lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);
        var googleStreets = L.tileLayer('http://{s}.google.com/vt?lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] });

        L.control.layers({ "🛰️ Peta Satelit": googleHybrid, "🗺️ Peta Jalan": googleStreets }, null, { position: 'topright' }).addTo(map);

        // --- RENDER JALUR DENGAN WARNA BERBEDA TIAP SUB-JALUR ---
        
        // Daftar palet warna neon eksklusif untuk tiap sub-jalur
        const subJalurColors = [
            '#0A84FF', // Electric Blue (Jalur A)
            '#BF5AF2', // Neon Purple (Jalur B)
            '#32ADE6', // Cyan Turquoise (Jalur C)
            '#FF9F0A', // Amber Gold (Jalur D)
            '#FF375F', // Pink Neon (Jalur E)
            '#30D158'  // Apple Green (Jalur F)
        ];

        // Ikon Server Utama
        var serverIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="server-wrapper"><div class="server-core"></div><div class="server-ring"></div></div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        L.marker([-6.5728706, 107.7746767], {icon: serverIcon}).addTo(map).bindPopup(`
            <b style="color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5);">SERVER CIBAROLA</b>
            <span style="font-size: 13px; color: rgba(255,255,255,0.6);">Titik Pusat Induk</span>
            <a href="https://www.google.com/maps/dir/?api=1&destination=-6.5728706,107.7746767" target="_blank" class="btn-navigasi">
                <i data-lucide="target" style="width: 16px; height: 16px;"></i> Arahkan Rute
            </a>
        `); 

        let globalSubIndex = 0;

        for (const server in dataJaringan) {
            for (const jalur in dataJaringan[server]) {
                
                // Ambil daftar titik dalam satu jalur (misal: "Perumahan Mahkota Graha", "BGSR", dll)
                const dataTitik = dataJaringan[server][jalur];
                
                // Kita kelompokkan atau pisahkan perkumpulan titik berdasarkan awalan atau urutan 
                // agar Mahkota 1, Mahkota 2, dst memiliki segmen warna garis tersendiri.
                // Disini kita buat setiap sub-kelompok nama jalur mendapat warna unik otomatis:
                let currentSubColor = subJalurColors[globalSubIndex % subJalurColors.length];
                globalSubIndex++;

                let urutanKoordinat = [];

                for (const namaOdp in dataTitik) {
                    const koordinat = dataTitik[namaOdp];
                    
                    if (koordinat !== "") {
                        const lat = parseFloat(koordinat.split(',')[0].trim());
                        const lng = parseFloat(koordinat.split(',')[1].trim());

                        urutanKoordinat.push([lat, lng]);

                        // Custom Node ODP dengan warna selaras jalurnya
                        const odpIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div class="node-wrapper"><div class="node-core" style="border-color: ${currentSubColor}; box-shadow: 0 0 12px ${currentSubColor};"></div></div>`,
                            iconSize: [16, 16], iconAnchor: [8, 8]
                        });

                        L.marker([lat, lng], {icon: odpIcon}).addTo(map).bindPopup(`
                            <b style="color: ${currentSubColor}; text-shadow: 0 0 8px ${currentSubColor};">${namaOdp}</b>
                            <span style="font-size: 12px; color: rgba(255,255,255,0.6);">${jalur}</span>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="btn-navigasi">
                                <i data-lucide="map-pin" style="width: 16px; height: 16px;"></i> Arahkan Rute
                            </a>
                        `);
                    }
                }

                // Gambar garis rute penghubung antar titik dengan warna unik sub-jalur tersebut
                if (urutanKoordinat.length > 1) {
                    // Outer Glow
                    L.polyline(urutanKoordinat, { color: currentSubColor, weight: 10, opacity: 0.2, lineCap: 'round', interactive: false }).addTo(map);
                    // Inner Neon
                    L.polyline(urutanKoordinat, { color: currentSubColor, weight: 4, opacity: 0.5, lineCap: 'round', interactive: false }).addTo(map);
                    // Core Solid
                    L.polyline(urutanKoordinat, { color: '#FFFFFF', weight: 1, opacity: 0.9, lineCap: 'round', interactive: false }).addTo(map);
                    // Aliran Data
                    L.polyline(urutanKoordinat, { color: '#FFFFFF', weight: 3, opacity: 1, lineCap: 'round', interactive: false, className: 'data-stream' }).addTo(map);
                }
            }
        }
        
        map.on('popupopen', function() { lucide.createIcons(); });
        
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
