<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring ODP - RnBNET</title>
    
    <!-- Memanggil CSS Leaflet untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #1a1a2e; color: white; }
        
        /* Desain Header ala Dashboard */
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 1000; /* Agar tetap di atas peta */
        }
        .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
        .btn-back {
            background: #4776E6; color: white; text-decoration: none; padding: 8px 15px;
            border-radius: 8px; font-size: 14px; font-weight: 600;
        }
        
        /* Area Peta Layar Penuh */
        #map { flex: 1; width: 100%; z-index: 1; }
        
        /* Kostumisasi Popup Peta */
        .leaflet-popup-content-wrapper { background: #1a1a2e; color: white; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .leaflet-popup-tip { background: #1a1a2e; }
        .leaflet-popup-content b { color: #4776E6; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 RnBNET - Live Monitoring</h1>
        <a href="index.html" class="btn-back">Kembali ke Pencarian</a>
    </div>

    <!-- Tempat Peta Ditampilkan -->
    <div id="map"></div>

    <!-- Memanggil Library Peta Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Memanggil Data ODP Anda -->
    <script src="data-odp.js"></script>

    <script>
        // 1. Inisialisasi Peta (Pusatkan di Server Cibarola)
        var map = L.map('map').setView([-6.5728706, 107.7746767], 16);

        // 2. MENYIAPKAN LAYER GOOGLE MAPS
        
        // A. Google Streets (Standar)
        var googleStreets = L.tileLayer('http://{s}.google.com/vt?lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        });

        // B. Google Hybrid (Satelit + Nama Jalan/Label)
        var googleHybrid = L.tileLayer('http://{s}.google.com/vt?lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        });

        // C. OpenStreetMap (Sebagai cadangan ringan)
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        });

        // Set Layer Default yang menyala pertama kali saat web dibuka
        googleHybrid.addTo(map);

        // 3. MENAMBAHKAN KONTROL PILIHAN LAYER
        var baseMaps = {
            "🛰️ Google Satelit": googleHybrid,
            "🗺️ Google Default": googleStreets,
            "🌐 OpenStreetMap": osm
        };
        
        // Memunculkan tombol pilihan layer di pojok kanan atas
        L.control.layers(baseMaps).addTo(map);

        // 4. Buat Ikon Khusus untuk Server
        var serverIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // 5. Tambahkan Titik Server Cibarola ke Peta
        L.marker([-6.5728706, 107.7746767], {icon: serverIcon})
            .addTo(map)
            .bindPopup("<b>🏢 SERVER CIBAROLA</b><br>Titik Pusat Induk")
            .openPopup(); 

        // 6. Loop (Putar) Data dari data-odp.js untuk menampilkan semua ODP
        for (const server in dataJaringan) {
            const daftarJalur = dataJaringan[server];
            
            for (const jalur in daftarJalur) {
                const daftarOdp = daftarJalur[jalur];
                
                for (const namaOdp in daftarOdp) {
                    const koordinatString = daftarOdp[namaOdp];
                    
                    if (koordinatString !== "") {
                        const coords = koordinatString.split(',');
                        const lat = parseFloat(coords[0].trim());
                        const lng = parseFloat(coords[1].trim());

                        L.marker([lat, lng])
                            .addTo(map)
                            .bindPopup(`<b>${namaOdp}</b><br>Jalur: ${jalur}<br>Server: ${server}`);
                    }
                }
            }
        }
    </script>
</body>
</html>
