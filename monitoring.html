<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoring ODP - RnBNET</title>
    
    <!-- Memanggil CSS Leaflet untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #1a1a2e; color: white; overflow: hidden; }
        
        /* Desain Header */
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }
        .header h1 { font-size: 16px; font-weight: 600; color: #fff; }
        .btn-back {
            background: rgba(255, 255, 255, 0.15); color: white; text-decoration: none; padding: 8px 12px;
            border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Area Peta Layar Penuh */
        #map { flex: 1; width: 100%; z-index: 1; }
        
        /* Kostumisasi Popup Peta (Dioptimalkan untuk HP) */
        .leaflet-popup-content-wrapper { background: #2a2a40; color: white; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); padding: 5px; }
        .leaflet-popup-tip { background: #2a2a40; }
        .leaflet-popup-content { margin: 10px; min-width: 180px; }
        .leaflet-popup-content b { color: #fff; font-size: 16px; display: block; margin-bottom: 2px; }
        
        /* Tombol Navigasi di dalam Popup */
        .btn-navigasi {
            display: block;
            background: linear-gradient(135deg, #28a745, #218838);
            color: white !important;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
        }
        .btn-navigasi:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 Live Monitoring</h1>
        <a href="index.html" class="btn-back">🔙 Kembali</a>
    </div>

    <!-- Tempat Peta Ditampilkan -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data-odp.js"></script>

    <script>
        var map = L.map('map', {
            zoomControl: false // Sembunyikan zoom control bawaan agar layar HP lebih luas
        }).setView([-6.5728706, 107.7746767], 16);

        // Pindahkan tombol zoom ke pojok kiri bawah (agar tidak nabrak jari di HP)
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Layer Peta
        var googleStreets = L.tileLayer('http://{s}.google.com/vt?lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });
        var googleHybrid = L.tileLayer('http://{s}.google.com/vt?lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });
        
        googleHybrid.addTo(map); // Default satelit

        L.control.layers({
            "🛰️ Satelit (Detail)": googleHybrid,
            "🗺️ Peta Jalan": googleStreets
        }, null, { position: 'topright' }).addTo(map);

        // Ikon Server
        var serverIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Titik Server
        L.marker([-6.5728706, 107.7746767], {icon: serverIcon})
            .addTo(map)
            .bindPopup(`
                <div style="text-align: center;">
                    <b style="color: #ff4757;">🏢 SERVER CIBAROLA</b>
                    <span style="font-size: 12px; color: #aaa;">Titik Pusat Induk</span>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=-6.5728706,107.7746767" target="_blank" class="btn-navigasi">📍 Rute ke Server</a>
                </div>
            `); 

        // Loop Data ODP
        for (const server in dataJaringan) {
            const daftarJalur = dataJaringan[server];
            for (const jalur in daftarJalur) {
                const daftarOdp = daftarJalur[jalur];
                for (const namaOdp in daftarOdp) {
                    const koordinatString = daftarOdp[namaOdp];
                    
                    if (koordinatString !== "") {
                        const coords = koordinatString.split(',');
                        const lat = parseFloat(coords[0].trim());
                        const lng = parseFloat(coords[1].trim());

                        // Membuat isi popup HTML dengan tombol navigasi
                        const popupContent = `
                            <div style="text-align: center;">
                                <b>${namaOdp}</b>
                                <span style="font-size: 12px; color: #ccc;">Jalur: ${jalur}</span>
                                <!-- Tombol direct rute Google Maps -->
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="btn-navigasi">📍 Arahkan ke Sini</a>
                            </div>
                        `;

                        L.marker([lat, lng])
                            .addTo(map)
                            .bindPopup(popupContent);
                    }
                }
            }
        }
    </script>
</body>
</html>
